name: AURA VOICE · Android APK
on:
  workflow_dispatch:
  push:
    branches: [feature/luna-voice-android]
    paths:
      - 'voice-app/**'
      - '.github/workflows/aura-voice-apk.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Hosted Ubuntu runners already include the Android SDK; avoid legacy `sdkmanager tools`.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript
        run: npm run check
      - name: Generate Android wrapper and grant microphone access
        run: npm run android:init
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: aura-voice-android-debug
          path: voice-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

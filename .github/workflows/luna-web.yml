name: Luna · Website checks
on:
  push:
    branches: [feature/luna-voice-android]
    paths:
      - 'voice-app/public/**'
      - 'voice-app/server.js'
      - 'voice-app/package.json'
      - 'voice-app/vercel.json'
      - '.github/workflows/luna-web.yml'
  pull_request:
    paths:
      - 'voice-app/public/**'
      - 'voice-app/server.js'
      - 'voice-app/package.json'
      - 'voice-app/vercel.json'
      - '.github/workflows/luna-web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check website JS and WebSocket server syntax
        run: npm run check
      - name: Verify static entry and Vercel output
        run: |
          node -e "const fs=require('node:fs'); const v=require('./vercel.json'); if(v.outputDirectory!=='public'||!fs.existsSync('public/index.html'))process.exit(1);"
          grep -q 'luna' public/index.html

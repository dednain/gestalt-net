services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      PORT: 3000
      ALLOWED_ORIGIN: https://${VOICE_DOMAIN}
      STUN_URL: stun:${VOICE_DOMAIN}:3478
      TURN_URLS: turn:${VOICE_DOMAIN}:3478?transport=udp,turn:${VOICE_DOMAIN}:3478?transport=tcp
      TURN_SECRET: ${TURN_SECRET}
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      VOICE_DOMAIN: ${VOICE_DOMAIN}
    depends_on: [app]
  turn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    command:
      - --no-cli
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${VOICE_DOMAIN}
      - --external-ip=${PUBLIC_IP}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
volumes:
  caddy-data:
  caddy-config:
